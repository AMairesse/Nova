name: Django CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16-bookworm
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: nova_connection_tests
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Create .env file
      run: |
        cp docker/.env.example .env
        echo "DEBUG=True" >> .env
    - name: Run Tests
      run: |
        python manage.py test --settings=nova.settings_test
    - name: Run PostgreSQL embedding tests
      env:
        DEBUG: 'False'
        CSRF_TRUSTED_ORIGINS: 'https://localhost,https://testserver'
      run: |
        python - <<'PY'
        import psycopg
        with psycopg.connect("host=127.0.0.1 port=15432 dbname=template1 user=postgres password=test-only", autocommit=True) as connection:
            connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
        PY
        python manage.py test nova.tests.test_embedding_provenance nova.tests.test_memory_tasks nova.tests.test_conversation_embeddings nova.tests.test_memory_rebuild_tasks --settings=nova.settings_test_postgres
